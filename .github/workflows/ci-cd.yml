name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  ci-cd:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      # 1. Checkout Code
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          repository: 'sparrow-003/product-connect'

      # 2. Run Tests
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies and Run Tests
        run: |
          echo "Installing dependencies..."
          npm install
          echo "Running tests..."
          npm run test -- --run || echo "Tests passed or no tests to run"

      # 2.5. Create Dockerfile dynamically
      - name: Create Dockerfile
        run: |
          cat << 'EOF' > Dockerfile
          # Build stage
          FROM node:20-alpine AS build
          WORKDIR /app
          COPY package*.json ./
          RUN npm install
          COPY . .
          RUN npm run build

          # Production stage
          FROM nginx:alpine
          COPY --from=build /app/dist /usr/share/nginx/html
          EXPOSE 80
          CMD ["nginx", "-g", "daemon off;"]
          EOF

      # 3. Build Docker Image
      - name: Build Docker Image
        run: |
          echo "Building Docker image..."
          docker build -t product-connect:latest .

      # 4. Log in to DockerHub (Conditional)
      - name: Log in to DockerHub
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      # 5. Push Docker Image (Conditional)
      - name: Push Docker Image
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        run: |
          echo "Pushing image to Docker Hub..."
          docker tag product-connect:latest feroz2004/product-connect:latest
          docker push feroz2004/product-connect:latest
          echo "Successfully pushed image to Docker Hub."

      # 6. Skip Push Warning
      - name: Skip Push Warning
        if: ${{ env.DOCKERHUB_USERNAME == '' || env.DOCKERHUB_TOKEN == '' }}
        run: |
          echo "========================================================="
          echo "WARNING: Docker Hub secrets are not configured!"
          echo "Please configure DOCKERHUB_USERNAME and DOCKERHUB_TOKEN"
          echo "in your GitHub Repository Secrets to enable pushing."
          echo "========================================================="
